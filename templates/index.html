<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Store</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#111;
            color:white;
            padding:20px;
            text-align:center;
        }

        .hero{
            height:400px;
            background:url('https://images.unsplash.com/photo-1485965120184-e220f721d03e?q=80&w=1200') center/cover;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            color:white;
            text-shadow:2px 2px 10px black;
        }

        .hero h1{
            font-size:60px;
        }

        .hero p{
            margin-top:10px;
            font-size:22px;
        }

        .container{
            width:90%;
            margin:auto;
            padding:40px 0;
        }

        .bike-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:30px;
        }

        .bike-card{
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .bike-card:hover{
            transform:translateY(-5px);
        }

        .bike-card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .bike-info{
            padding:20px;
            text-align:center;
        }

        .bike-info h3{
            margin-bottom:10px;
        }

        .price{
            color:#ff6600;
            font-size:22px;
            font-weight:bold;
        }

        .btn{
            display:inline-block;
            margin-top:15px;
            padding:10px 20px;
            background:#111;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        footer{
            background:#111;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>
<body>

<header>
    <h1>Bike Shopping Website</h1>
</header>

<section class="hero">
    <h1>Ride Your Dream</h1>
    <p>Explore Premium Bikes</p>
</section>

<div class="container">

    <h2 style="margin-bottom:30px;">Featured Bikes</h2>

    <div class="bike-grid">

        {% for bike in bikes %}

        <div class="bike-card">

            <img src="{{ bike.image }}" alt="{{ bike.name }}">

            <div class="bike-info">
                <h3>{{ bike.name }}</h3>

                <p class="price">${{ bike.price }}</p>

                <a href="#" class="btn">Add to Cart</a>
            </div>

        </div>

        {% endfor %}

    </div>

</div>

<footer>
    <p>© 2026 Bike Store | Built with Flask</p>
</footer>

</body>
</html>
